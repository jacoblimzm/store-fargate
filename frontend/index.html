<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pay2Play</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A6%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◈</span> Pay2Play
      </div>
      <button id="logoutBtn" class="btn btn-ghost hidden">Log out</button>
    </header>

    <main id="app" class="container">
      <!-- Login view -->
      <section id="loginView" class="view">
        <div class="card auth-card">
          <h1>Welcome back</h1>
          <p class="muted">Sign in to your Pay2Play account.</p>
          <form id="loginForm">
            <label>
              Email
              <input type="email" id="email" autocomplete="username" required />
            </label>
            <label>
              Password
              <input type="password" id="password" autocomplete="current-password" required />
            </label>
            <button type="submit" class="btn btn-primary">Sign in</button>
            <p id="loginError" class="error hidden"></p>
          </form>
          <p class="muted demo-hint">
            Demo: <code>ada@pay2play.test</code> / <code>Password123!</code>
          </p>
        </div>
      </section>

      <!-- Dashboard view -->
      <section id="dashboardView" class="view hidden">
        <div class="welcome">
          <h1 id="welcomeName">Welcome</h1>
          <p class="muted" id="welcomeEmail"></p>
        </div>
        <h2>Your accounts</h2>
        <div id="accountList" class="account-grid"></div>
      </section>

      <!-- Account detail / transactions view -->
      <section id="accountView" class="view hidden">
        <button id="backBtn" class="btn btn-ghost">&larr; Back to accounts</button>
        <div class="card account-summary">
          <div>
            <p class="muted" id="detailType"></p>
            <p class="account-number" id="detailNumber"></p>
          </div>
          <div class="balance">
            <p class="muted">Balance</p>
            <p class="balance-amount" id="detailBalance"></p>
          </div>
        </div>
        <h2>Transaction history</h2>
        <table class="tx-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th class="right">Amount</th>
              <th class="right">Balance</th>
            </tr>
          </thead>
          <tbody id="txBody"></tbody>
        </table>
      </section>
    </main>

    <!-- Chat assistant add-on (OpenAI-backed, instrumented by Datadog LLM Obs) -->
    <button id="chatFab" class="chat-fab" aria-label="Open assistant">
      <span aria-hidden="true">✨</span>
    </button>
    <section id="chatPanel" class="chat-panel hidden" aria-live="polite">
      <header class="chat-header">
        <span class="chat-title"><span class="brand-mark">◈</span> Assistant</span>
        <button id="chatClose" class="btn btn-ghost chat-close" aria-label="Close">✕</button>
      </header>
      <div id="chatLog" class="chat-log"></div>
      <form id="chatForm" class="chat-input">
        <input id="chatText" type="text" placeholder="Ask about your accounts…" autocomplete="off" />
        <button type="submit" class="btn btn-primary chat-send">Send</button>
      </form>
    </section>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/chat.js"></script>
  </body>
</html>
