# nginx serves the static SPA and reverse-proxies /api to the backend.
#
# BACKEND_HOST is templated at container start (see docker-entrypoint):
#   - docker-compose (separate networks): backend
#   - ECS Fargate (shared task network):  127.0.0.1
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets / SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
