; Runs nginx + gunicorn + a small traffic generator in one container so the
; container continuously emits nginx access logs, nginx error logs, and python
; JSON logs to stdout/stderr. supervisord itself logs to stdout.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:gunicorn]
command=ddtrace-run gunicorn -c /app/gunicorn.conf.py app:app
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:traffic]
; Generate a normal (200) access log, a denied (403 -> error log) line, and a
; python JSON log carrying sensitive data (for the obfuscation demo).
command=/bin/sh -c "sleep 8; while true; do curl -s -o /dev/null http://127.0.0.1:8080/api/health; curl -s -o /dev/null http://127.0.0.1:8080/nginx_status; curl -s -o /dev/null http://127.0.0.1:8080/api/pay; sleep 10; done"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
