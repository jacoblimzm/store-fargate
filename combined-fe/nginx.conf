# Full nginx.conf for the combined POC container (overwrites the distro default).
# Logs go to the container's stdout/stderr so FireLens picks them up alongside
# the python JSON logs -- the whole point of the reproduction.
worker_processes 1;
error_log /dev/stderr info;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Standard "combined" access log format (same shape as the customer's).
    access_log /dev/stdout combined;

    sendfile on;

    server {
        listen 8080;
        server_name localhost;

        # Reverse proxy to the in-container gunicorn app (8001 to avoid colliding
        # with the backend container's gunicorn on 8000 in the shared namespace).
        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Restricted endpoint: any request is denied, which makes nginx emit an
        # "access forbidden by rule" [error] line -- exactly the customer's case.
        location /nginx_status {
            deny all;
        }
    }
}
