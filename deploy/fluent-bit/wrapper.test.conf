[SERVICE]
    Flush        1
    Daemon       off
    Log_Level    error
    Parsers_File /fluent-bit/parsers/parsers.conf

# Simulate the combined-fe container's stdout: one nginx access line and one
# python JSON line, both arriving under the same FireLens tag.
[INPUT]
    Name  dummy
    Tag   combined-fe-firelens-test
    Dummy {"log": "54.248.79.33 - - [26/Aug/2026:08:39:05 +0000] \"GET /cms/api HTTP/1.1\" 200 1234 \"-\" \"Mozilla/5.0\""}

[INPUT]
    Name  dummy
    Tag   combined-fe-firelens-test
    Dummy {"log": "2026/08/26 17:12:34 [error] 655#655: *2467 access forbidden by rule, client: 172.20.49.119"}

[INPUT]
    Name  dummy
    Tag   combined-fe-firelens-test
    Dummy {"log": "{\"level\":\"INFO\",\"message\":\"[WORKER_HOLD]\",\"channel\":\"production\"}"}

@INCLUDE /extra.conf

# Observability for the test only: the stdout plugin's default format prints the
# final TAG of every record, so we can see nginx lines re-tagged to `nginx` and
# the JSON line left on the original combined-fe-firelens-test tag.
[OUTPUT]
    Name   stdout
    Match  *
