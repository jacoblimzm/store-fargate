# Local orchestration for Phase 1 (app only). The Datadog agent sidecar is
# added in Phase 2 (see docker-compose.datadog.yml).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pay2play}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pay2play_local_pw}
      POSTGRES_DB: ${POSTGRES_DB:-pay2play}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pay2play} -d ${POSTGRES_DB:-pay2play}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pay2play}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pay2play_local_pw}
      POSTGRES_DB: ${POSTGRES_DB:-pay2play}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET:-change-me-local-dev-secret}
      JWT_EXP_MINUTES: ${JWT_EXP_MINUTES:-60}
      SEED_ON_START: ${SEED_ON_START:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8000"
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db-data:
